<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>STEP 31C ガチャバランステスト｜ファミリーガチャ</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0b0b}
#game-frame{position:fixed;inset:0;width:100%;height:100vh;height:100dvh;border:0}
#status{position:fixed;bottom:max(10px,env(safe-area-inset-bottom));left:10px;z-index:2147483647;pointer-events:none;max-width:min(90vw,360px);padding:7px 10px;background:rgba(13,40,64,.95);color:#fff;border:1px solid #71cdfb;border-radius:8px;font:600 12px/1.4 system-ui}
#status.error{background:#6d2525}
</style>
</head>
<body>
<iframe id="game-frame" src="./index.html?balance-test=31C" title="ファミリーガチャ STEP31C"></iframe>
<div id="status" role="status" aria-live="polite">STEP 31C 読み込み中…</div>
<script>
(function(){
  "use strict";
  const frame=document.getElementById("game-frame");
  const status=document.getElementById("status");
  function report(text,error){status.textContent=text;status.classList.toggle("error",!!error);}
  frame.addEventListener("load",function(){
    try{
      const game=frame.contentWindow;
      if(!game || typeof game.drawTenCards!=="function" ||
         typeof game.saveCurrentResultsToAlbum!=="function") throw new Error("ゲームが読み込めません");
      const badge=game.document.getElementById("version-check-badge");
      if(!badge || !badge.textContent.includes("31C")) throw new Error("通常ゲームがSTEP 31Cではありません");
      // Test page only: never save these draws to the album.
      game.saveCurrentResultsToAlbum=function(){return new game.Set();};
      report("STEP 31C 準備OK｜通常版と同じ抽選バランス／アルバム保存なし");
    }catch(error){report("STEP 31A 準備失敗："+error.message,true);console.error(error);}
  });
})();
</script>
</body>
</html>
