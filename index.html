    <!-- TEST-28E17: カード014〜017の表示名だけ、既存アルバム保存記録と同期 -->
    <script>
      (function () {
        try {
          const key = "family-gacha-album";
          const raw = localStorage.getItem(key);
          if (raw !== null) {
            const saved = JSON.parse(raw);
            if (saved && typeof saved === "object" && !Array.isArray(saved)) {
              let changed = false;
              ["card014", "card015", "card016", "card017"].forEach(function (id) {
                const card = cardPool.find(function (item) { return item.id === id; });
                if (card && saved[id] && saved[id].name !== card.name) {
                  saved[id].name = card.name;
                  changed = true;
                }
              });
              if (changed) localStorage.setItem(key, JSON.stringify(saved));
            }
          }
        } catch (error) {
          // 保存が使えない場合もゲームは止めない。
        }
        const badge = document.getElementById("version-check-badge");
        if (badge && cardPool.length === 17 &&
            cardPool.some(function (card) { return card.id === "card017" && card.rarity === "UR"; })) {
          badge.textContent = "TEST -28E17 / JS OK";
        }
      })();
    </script>
